{% extends 'base.html' %}
{% block title %}School Years{% endblock %}
{% block page_title %}School Years{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="page-head flex-col items-stretch sm:flex-row sm:items-center sm:justify-between">
            <h1 class="page-head-title">School Years</h1>
        <div class="flex items-center gap-2">
            <a href="{% url 'academics:grading_period_list' %}" class="btn btn-secondary btn-sm">Terms</a>
            <button onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:school_year_create' %}' } }))" class="btn btn-primary">Add School Year</button>
        </div>
    </div>
    <div class="glass-card">
        <div class="overflow-x-auto">
            {% include 'academics/partials/school_year_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
