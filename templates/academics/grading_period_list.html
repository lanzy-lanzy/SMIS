{% extends 'base.html' %}
{% block title %}Grading Periods{% endblock %}
{% block page_title %}Grading Periods{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="page-head flex-col items-stretch sm:flex-row sm:items-center sm:justify-between">
            <h1 class="page-head-title">Grading Periods</h1>
        <div class="flex items-center gap-2">
            <a href="{% url 'academics:school_year_list' %}" class="btn btn-secondary btn-sm">School Years</a>
            <button onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:grading_period_create' %}' } }))" class="btn btn-primary">Add Grading Period</button>
        </div>
    </div>
    <div class="glass-card">
        <form method="get" class="student-filter-panel flex flex-wrap items-end gap-3" aria-label="Filter grading periods">
            <label class="table-filter-field">School year
                <select name="school_year" class="px-3 py-2">
                    {% include 'academics/partials/school_year_options.html' with selected_year=year_filter %}
                </select>
            </label>
            <button type="submit" class="btn btn-primary">Apply filters</button>
            <a href="{% url 'academics:grading_period_list' %}" class="btn btn-secondary">Reset filters</a>
        </form>
        <div class="overflow-x-auto">
            {% include 'academics/partials/grading_period_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
