<div class="rounded-xl border border-gray-200 dark:border-slate-700 bg-gray-50/70 dark:bg-slate-800/50 p-4 space-y-3" data-schedule-builder>
    <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
            <p class="text-sm font-semibold text-gray-800 dark:text-gray-100">Class Schedule</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">Set different times per day if needed. Checked for teacher, section, and overlap conflicts.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-fill-weekdays class="rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition">
                Fill Mon–Fri
            </button>
            <button type="button" data-add-slot class="inline-flex items-center gap-1 rounded-lg bg-primary px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-primary-700 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Day Slot
            </button>
        </div>
    </div>

    <div data-slot-rows class="space-y-2.5">
        {% for slot in form.schedule_slots %}
        <div data-slot-row class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900/60 p-2.5">
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Day</label>
                <select name="slot_day" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
                    <option value="">Select day</option>
                    <option value="Mon" {% if slot.day == 'Mon' %}selected{% endif %}>Monday</option>
                    <option value="Tue" {% if slot.day == 'Tue' %}selected{% endif %}>Tuesday</option>
                    <option value="Wed" {% if slot.day == 'Wed' %}selected{% endif %}>Wednesday</option>
                    <option value="Thu" {% if slot.day == 'Thu' %}selected{% endif %}>Thursday</option>
                    <option value="Fri" {% if slot.day == 'Fri' %}selected{% endif %}>Friday</option>
                    <option value="Sat" {% if slot.day == 'Sat' %}selected{% endif %}>Saturday</option>
                </select>
            </div>
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Start</label>
                <input type="time" name="slot_start" value="{{ slot.start_time }}" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
            </div>
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">End</label>
                <input type="time" name="slot_end" value="{{ slot.end_time }}" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
            </div>
            <div class="sm:col-span-2">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Room</label>
                <input type="text" name="slot_room" value="{{ slot.room }}" placeholder="Optional" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
            </div>
            <div class="sm:col-span-1 flex justify-end">
                <button type="button" data-remove-slot title="Remove slot" aria-label="Remove schedule slot" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>
        {% endfor %}
    </div>

    <p data-empty-hint class="text-xs text-gray-500 dark:text-gray-400 {% if form.schedule_slots %}hidden{% endif %}">
        No schedule slots added yet. Click <strong>Add Day Slot</strong> to schedule specific days and times.
    </p>

    <template data-slot-template>
        <div data-slot-row class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900/60 p-2.5">
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Day</label>
                <select name="slot_day" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
                    <option value="">Select day</option>
                    <option value="Mon">Monday</option>
                    <option value="Tue">Tuesday</option>
                    <option value="Wed">Wednesday</option>
                    <option value="Thu">Thursday</option>
                    <option value="Fri">Friday</option>
                    <option value="Sat">Saturday</option>
                </select>
            </div>
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Start</label>
                <input type="time" name="slot_start" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
            </div>
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">End</label>
                <input type="time" name="slot_end" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
            </div>
            <div class="sm:col-span-2">
                <label class="block text-[11px] font-medium text-gray-500 dark:text-gray-400 mb-1">Room</label>
                <input type="text" name="slot_room" placeholder="Optional" class="w-full px-2.5 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
            </div>
            <div class="sm:col-span-1 flex justify-end">
                <button type="button" data-remove-slot title="Remove slot" aria-label="Remove schedule slot" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>
    </template>
</div>
<script>
(function () {
    const builders = document.querySelectorAll('[data-schedule-builder]');
    const dayOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

    builders.forEach((builder) => {
        if (builder.dataset.initialized) return;
        builder.dataset.initialized = '1';

        const rowsWrap = builder.querySelector('[data-slot-rows]');
        const tpl = builder.querySelector('[data-slot-template]');
        const emptyHint = builder.querySelector('[data-empty-hint]');
        const addBtn = builder.querySelector('[data-add-slot]');
        const fillBtn = builder.querySelector('[data-fill-weekdays]');

        function syncEmpty() {
            const hasRows = rowsWrap.querySelectorAll('[data-slot-row]').length > 0;
            emptyHint.classList.toggle('hidden', hasRows);
        }

        function addRow(defaults) {
            const frag = tpl.content.cloneNode(true);
            const row = frag.querySelector('[data-slot-row]');
            if (defaults) {
                if (defaults.day) row.querySelector('select[name="slot_day"]').value = defaults.day;
                if (defaults.start) row.querySelector('input[name="slot_start"]').value = defaults.start;
                if (defaults.end) row.querySelector('input[name="slot_end"]').value = defaults.end;
                if (defaults.room) row.querySelector('input[name="slot_room"]').value = defaults.room;
            }
            rowsWrap.appendChild(frag);
            syncEmpty();
        }

        addBtn.addEventListener('click', () => {
            const existingRows = Array.from(rowsWrap.querySelectorAll('[data-slot-row]'));
            const usedDays = new Set(existingRows.map(r => r.querySelector('select[name="slot_day"]').value).filter(Boolean));
            const nextDay = dayOrder.find(d => !usedDays.has(d)) || 'Mon';
            const last = existingRows[existingRows.length - 1];
            addRow({
                day: nextDay,
                start: last ? last.querySelector('input[name="slot_start"]').value : '',
                end: last ? last.querySelector('input[name="slot_end"]').value : '',
                room: last ? last.querySelector('input[name="slot_room"]').value : '',
            });
        });

        fillBtn.addEventListener('click', () => {
            const existingRows = Array.from(rowsWrap.querySelectorAll('[data-slot-row]'));
            const first = existingRows[0];
            const start = first ? first.querySelector('input[name="slot_start"]').value : '08:00';
            const end = first ? first.querySelector('input[name="slot_end"]').value : '09:00';
            const room = first ? first.querySelector('input[name="slot_room"]').value : '';
            const usedDays = new Set(existingRows.map(r => r.querySelector('select[name="slot_day"]').value).filter(Boolean));
            weekdays.forEach((day) => {
                if (!usedDays.has(day)) {
                    addRow({ day, start, end, room });
                }
            });
        });

        rowsWrap.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-remove-slot]');
            if (!btn) return;
            const row = btn.closest('[data-slot-row]');
            if (row) row.remove();
            syncEmpty();
        });
    });
})();
</script>
