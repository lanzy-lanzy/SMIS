<div class="p-6">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">{{ title }}</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    <form method="post" hx-post="{{ request.path }}" hx-target="#modal-content" hx-swap="innerHTML" class="space-y-4">
        {% csrf_token %}
        {% include "academics/partials/assignment_errors.html" %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="{{ form.teacher.id_for_label }}" class="block text-sm font-medium mb-1">{{ form.teacher.label }}</label>
                {{ form.teacher }}
            </div>
            <div>
                <label for="{{ form.school_year.id_for_label }}" class="block text-sm font-medium mb-1">{{ form.school_year.label }}</label>
                {{ form.school_year }}
            </div>
            <div>
                <label for="{{ form.subject.id_for_label }}" class="block text-sm font-medium mb-1">{{ form.subject.label }}</label>
                {{ form.subject }}
            </div>
            <div>
                <label for="{{ form.section.id_for_label }}" class="block text-sm font-medium mb-1">{{ form.section.label }}</label>
                {{ form.section }}
            </div>
        </div>

        {% include "academics/partials/assignment_schedule_fields.html" %}

        <div class="flex gap-3 pt-4 border-t">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
        </div>
    </form>
</div>
