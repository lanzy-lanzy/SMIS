<table class="w-full text-sm">
    <thead class="bg-gray-50 dark:bg-slate-700">
        <tr>
            <th class="px-4 py-3 text-left font-medium">Name</th>
            <th class="px-4 py-3 text-left font-medium">Level</th>
            <th class="px-4 py-3 text-left font-medium">Description</th>
            <th class="px-4 py-3 text-right font-medium">Actions</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
        {% for gl in grade_levels %}
        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/50">
            <td class="px-4 py-3">{{ gl.name }}</td>
            <td class="px-4 py-3">{{ gl.level }}</td>
            <td class="px-4 py-3">{{ gl.description }}</td>
            <td class="px-4 py-3 text-right">
                <a href="{% url 'academics:grade_level_edit' gl.pk %}" class="text-blue-600 hover:underline mr-2">Edit</a>
                <a href="{% url 'academics:grade_level_delete' gl.pk %}" class="text-red-600 hover:underline">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">No grade levels found</td></tr>
        {% endfor %}
    </tbody>
</table>
