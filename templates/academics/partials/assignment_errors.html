{% if form.errors %}
<div role="alert" class="rounded-xl bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300">
    {{ form.non_field_errors }}
    {% for field in form %}
        {% for error in field.errors %}<p>{{ field.label }} — {{ error }}</p>{% endfor %}
    {% endfor %}
</div>
{% endif %}
