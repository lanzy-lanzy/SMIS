<table id="section-table" class="w-full text-sm" hx-get="{% url 'academics:section_list' %}" hx-trigger="refresh" hx-target="this" hx-swap="outerHTML">
    <thead class="bg-gray-50 dark:bg-slate-700">
        <tr>
            <th class="px-4 py-3 text-left font-medium">Name</th>
            <th class="px-4 py-3 text-left font-medium">Grade Level</th>
            <th class="px-4 py-3 text-left font-medium">School Year</th>
            <th class="px-4 py-3 text-left font-medium">Adviser</th>
            <th class="px-4 py-3 text-right font-medium">Actions</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
        {% for sec in sections %}
        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/50">
            <td class="px-4 py-3">{{ sec.name }}</td>
            <td class="px-4 py-3">{{ sec.grade_level }}</td>
            <td class="px-4 py-3">{{ sec.school_year }}</td>
            <td class="px-4 py-3">{{ sec.adviser }}</td>
            <td class="px-4 py-3 text-right">
                <button type="button" onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:section_edit' sec.pk %}' } }))" class="text-blue-600 hover:underline mr-2">Edit</button>
                <button type="button" onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:section_delete' sec.pk %}' } }))" class="text-red-600 hover:underline">Delete</button>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">No sections found</td></tr>
        {% endfor %}
    </tbody>
</table>
