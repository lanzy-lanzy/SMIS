<table id="school-year-table" class="w-full text-sm" hx-get="{% url 'academics:school_year_list' %}" hx-trigger="refresh" hx-target="this" hx-swap="outerHTML">
    <thead class="bg-gray-50 dark:bg-slate-700">
        <tr>
            <th class="px-4 py-3 text-left font-medium">Name</th>
            <th class="px-4 py-3 text-left font-medium">Current</th>
            <th class="px-4 py-3 text-right font-medium">Actions</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
        {% for sy in school_years %}
        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/50">
            <td class="px-4 py-3">{{ sy.name }}</td>
            <td class="px-4 py-3">{% if sy.is_current %}<span class="text-green-600">Yes</span>{% else %}No{% endif %}</td>
            <td class="px-4 py-3 text-right">
                <button type="button" onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:school_year_edit' sy.pk %}' } }))" class="text-blue-600 hover:underline mr-2">Edit</button>
                <button type="button" onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:school_year_delete' sy.pk %}' } }))" class="text-red-600 hover:underline">Delete</button>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="px-4 py-8 text-center text-gray-500">No school years found</td></tr>
        {% endfor %}
    </tbody>
</table>
