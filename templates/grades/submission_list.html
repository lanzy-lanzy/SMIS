{% extends 'base.html' %}
{% block title %}Grade Submissions{% endblock %}
{% block page_title %}Grade Submissions{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-xl font-bold">Grade Submissions</h1>
            <p class="text-sm text-gray-500">Review and validate submitted grades</p>
        </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700">
        <div class="p-4 border-b border-gray-100 dark:border-slate-700">
            <select name="status" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white"
                    hx-get="{% url 'grades:submission_list' %}" hx-target="#submission-table" hx-trigger="change" hx-include="[name='status']">
                <option value="">All Status</option>
                {% for val, label in status_choices %}
                <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="overflow-x-auto" id="submission-table">
            {% include 'grades/partials/submission_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
