{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SMIS</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script defer src="{% static 'js/alpine.min.js' %}"></script>
</head>
<body class="h-full bg-gray-50 dark:bg-slate-900 flex items-center justify-center">
    <div class="w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">SMIS</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Paquito S. Yu Memorial National High School</p>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-8">
            <h2 class="text-xl font-semibold mb-6 text-center">Sign In</h2>
            {% if form.errors %}
            <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-red-700 dark:text-red-300 text-sm">
                Invalid username or password.
            </div>
            {% endif %}
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    {{ form.username }}
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary-700 text-white font-semibold py-3 rounded-lg transition">
                    Sign In
                </button>
            </form>
        </div>
        <div class="mt-4 text-center">
            <a href="{% url 'dashboard:landing' %}" class="inline-flex items-center gap-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Home
            </a>
        </div>
        <p class="text-center text-xs text-gray-400 mt-6">&copy; 2026 SMIS. All rights reserved.</p>
    </div>
</body>
</html>
