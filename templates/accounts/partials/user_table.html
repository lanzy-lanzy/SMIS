<table class="w-full text-sm">
    <thead class="bg-gray-50 dark:bg-slate-700">
        <tr>
            <th class="px-4 py-3 text-left font-medium">Username</th>
            <th class="px-4 py-3 text-left font-medium">Name</th>
            <th class="px-4 py-3 text-left font-medium">Email</th>
            <th class="px-4 py-3 text-left font-medium">Role</th>
            <th class="px-4 py-3 text-left font-medium">Status</th>
            <th class="px-4 py-3 text-right font-medium">Actions</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
        {% for u in users %}
        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/50">
            <td class="px-4 py-3">{{ u.username }}</td>
            <td class="px-4 py-3">{{ u.get_full_name }}</td>
            <td class="px-4 py-3">{{ u.email }}</td>
            <td class="px-4 py-3">{{ u.get_role_display }}</td>
            <td class="px-4 py-3">
                <span class="px-2 py-1 text-xs rounded-full {% if u.is_active %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
                    {% if u.is_active %}Active{% else %}Inactive{% endif %}
                </span>
            </td>
            <td class="px-4 py-3 text-right">
                <a href="{% url 'accounts:user_edit' u.pk %}" class="text-blue-600 hover:underline mr-2">Edit</a>
                <a href="{% url 'accounts:user_delete' u.pk %}" class="text-red-600 hover:underline">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No users found</td></tr>
        {% endfor %}
    </tbody>
</table>
