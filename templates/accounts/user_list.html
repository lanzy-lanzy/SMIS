{% extends 'base.html' %}
{% block title %}Users{% endblock %}
{% block page_title %}User Management{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold">Users</h1>
        <button onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'accounts:user_create' %}' } }))" class="bg-primary hover:bg-blue-800 text-white px-4 py-2 rounded-lg transition">Add User</button>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700">
        <div class="p-4 border-b border-gray-100 dark:border-slate-700">
            <form method="get" class="flex gap-3">
                <input type="text" name="q" value="{{ query }}" placeholder="Search users..."
                       class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                <select name="role" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
                    <option value="">All Roles</option>
                    {% for val, label in roles %}
                    <option value="{{ val }}" {% if role_filter == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="bg-secondary hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">Search</button>
            </form>
        </div>
        <div class="overflow-x-auto" id="user-table" hx-get="{% url 'accounts:user_list' %}" hx-trigger="refreshTable from:body">
            {% include 'accounts/partials/user_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
