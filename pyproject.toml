[project]
name = "smis"
version = "1.0.0"
description = "Web-Based School Management System for Paquito S. Yu Memorial NHS"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1,<5.2",
    "python-decouple>=3.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
dev = ["black", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "accounts", "students", "academics", "grades", "reports", "form137", "dashboard", "templates"]

[tool.uv]
dev-dependencies = ["black", "ruff"]
